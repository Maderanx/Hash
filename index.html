<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Hash Generator</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 50px; }
        input, button { margin-top: 10px; }
        #hashOutput { margin-top: 20px; word-wrap: break-word; }
    </style>
</head>
<body>
    <h2>SHA-256 File Hash Generator</h2>
    <input type="file" id="fileInput">
    <button onclick="computeHash()">Generate Hash</button>

    <p><strong>SHA-256 Hash (Lowercase):</strong></p>
    <p id="hashLowerOutput"></p>
    <button onclick="copyToClipboard('hashLowerOutput')">Copy Lowercase Hash</button>

    <p><strong>SHA-256 Hash (Uppercase):</strong></p>
    <p id="hashUpperOutput"></p>
    <button onclick="copyToClipboard('hashUpperOutput')">Copy Uppercase Hash</button>

    <p><small>Both values are the same, just displayed in different cases.</small></p>

    <script>
        async function computeHash() {
            const fileInput = document.getElementById("fileInput");
            const hashLowerOutput = document.getElementById("hashLowerOutput");
            const hashUpperOutput = document.getElementById("hashUpperOutput");

            if (fileInput.files.length === 0) {
                alert("Please select a file.");
                return;
            }

            const file = fileInput.files[0];
            const arrayBuffer = await file.arrayBuffer();
            const hashBuffer = await crypto.subtle.digest("SHA-256", arrayBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashLower = hashArray.map(byte => byte.toString(16).padStart(2, "0")).join("");
            const hashUpper = hashLower.toUpperCase();

            hashLowerOutput.innerText = hashLower;
            hashUpperOutput.innerText = hashUpper;
        }

        function copyToClipboard(elementId) {
            const hashText = document.getElementById(elementId).innerText;
            if (!hashText) return;

            navigator.clipboard.writeText(hashText).then(() => {
                alert("Hash copied to clipboard!");
            });
        }
    </script>
</body>
</html>
